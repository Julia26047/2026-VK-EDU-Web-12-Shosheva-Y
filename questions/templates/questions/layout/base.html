{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AskPupkin{% endblock %}</title>

  <link rel="icon" href="{% static 'core/img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'index' %}">AskPupkin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <form class="d-flex flex-grow-1 mx-md-3 my-2 my-md-0" role="search">
          <input class="form-control me-2" type="search" placeholder="Поиск">
          <button class="btn btn-outline-secondary" type="submit">Найти</button>
        </form>
        <a class="btn btn-success me-md-3 mb-2 mb-md-0" href="{% url 'ask' %}">ASK!</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary" href="{% url 'login' %}">Войти</a>
          <a class="btn btn-outline-secondary" href="{% url 'signup' %}">Регистрация</a>
        </div>
      </div>
    </div>
  </header>

  <div class="container my-4 flex-grow-1">
    <div class="row g-4">

      {% block content %}{% endblock %}

      <aside class="col-lg-3">
        <div class="card mb-4">
          <div class="card-header fw-bold">Popular tags</div>
          <div class="card-body d-flex flex-wrap gap-2">
            <a href="{% url 'tag' 'python' %}" class="badge text-bg-primary text-decoration-none">python</a>
            <a href="{% url 'tag' 'django' %}" class="badge text-bg-secondary text-decoration-none">django</a>
            <a href="{% url 'tag' 'html' %}" class="badge text-bg-success text-decoration-none">html</a>
            <a href="{% url 'tag' 'css' %}" class="badge text-bg-warning text-decoration-none">css</a>
            <a href="{% url 'tag' 'git' %}" class="badge text-bg-info text-decoration-none">git</a>
          </div>
        </div>
        <div class="card">
          <div class="card-header fw-bold">Best members</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item"><a href="#" class="text-decoration-none">Mr. Freeman</a></li>
            <li class="list-group-item"><a href="#" class="text-decoration-none">Dr. House</a></li>
            <li class="list-group-item"><a href="#" class="text-decoration-none">Bender</a></li>
          </ul>
        </div>
      </aside>

    </div>
  </div>

  <footer class="border-top bg-body-tertiary py-3 mt-auto">
    <div class="container text-center text-muted small">
      © 2026 AskPupkin — учебный проект VK Education
    </div>
  </footer>

  <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
