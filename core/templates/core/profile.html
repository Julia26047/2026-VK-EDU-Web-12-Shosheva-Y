{% extends 'questions/layout/base.html' %}
{% load static %}

{% block title %}Профиль — AskPupkin{% endblock %}

{% block content %}
<div class="col-12 col-lg-9">
  <h3 class="mb-3">Настройки профиля</h3>
  <form class="form-narrow">
    <div class="alert alert-danger">Не удалось сохранить настройки. Проверьте поля формы.</div>
    <div class="text-center mb-3">
      <img src="{% static 'img/avatar.svg' %}" alt="Аватар" class="avatar-lg mb-2" width="100" height="100">
      <input type="file" class="form-control mt-2" accept="image/*">
    </div>
    <div class="mb-3">
      <label class="form-label">Логин</label>
      <input type="text" class="form-control" value="dr_pepper">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control is-invalid" value="pepper@">
      <div class="invalid-feedback">Вы ввели невалидный email.</div>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>
</div>
{% endblock %}
